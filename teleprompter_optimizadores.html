<script>
const SLIDES = [{"t": 15, "title": "Apertura", "html": "<p><span class='cue'>SONRÍE, MIRÁ A LA SALA</span></p><p>Buenas a todos. Hoy les voy a contar por qué una red neuronal a veces simplemente no aprende, y cómo un solo cambio en la forma de ajustar sus pesos puede arreglar eso por completo.</p>"}, {"t": 30, "title": "El gancho: la cocinera", "html": "<p><span class='cue'>PAUSA UN SEGUNDO ANTES DE ARRANCAR</span></p><p>Imagínense una cocinera preparando la misma receta una y otra vez: la prueba, corrige la sazón, la vuelve a probar. Así es exactamente como entrena una red neuronal — prueba, corrige, vuelve a probar. Y la pregunta que nos va a guiar hoy es esta: ¿por qué un cocinero con más experiencia siempre le termina ganando al que corrige a ciegas? Esa diferencia tiene nombre, y se llama <b>optimizador</b>.</p>"}, {"t": 50, "title": "Equivalencias clave", "html": "<p><span class='cue'>[MOSTRÁ LA DIAPOSITIVA DE EQUIVALENCIAS]</span></p><p>Antes de arrancar, les dejo el mapa que vamos a usar durante toda la charla de hoy. La idea central es simple: entrenar una red neuronal se parece muchísimo a ajustar una receta, probándola una y otra vez hasta encontrar el punto justo. Estos son los cinco términos que vamos a usar como sinónimos:</p><ul class='bullets'><li><b>Plato final</b> = la red ya entrenada</li><li><b>Sazón que se corrige</b> = los pesos de la red</li><li><b>Probar y notar qué falta</b> = el gradiente</li><li><b>Tamaño de la cucharada</b> = el learning rate</li><li><b>Recordar la tendencia</b> = Momentum</li></ul><p>Con estos cinco términos alcanza para seguir absolutamente todo lo que viene, así que si en algún momento se pierden, vuelvan a este mapa.</p>"}, {"t": 45, "title": "Qué es un optimizador", "html": "<p>Pensemos en esa cocinera probando su receta. Cada vez que prueba, tiene que decidir tres cosas: <b>qué</b> corregir, <b>cuánto</b> corregir, y si decide mirando solo esta probada o si tiene <b>memoria</b> de las correcciones anteriores. Un optimizador es exactamente esa decisión, pero formalizada matemáticamente, número por número. Y acá va la idea que quiero que se lleven de esta parte de la charla: SGD, Momentum y Adam no son cosas completamente distintas entre sí, no son recetas separadas que compiten. Son la <b>misma receta de ajuste</b>, cada vez un poco más sofisticada, y cada una resolviendo el problema que la anterior dejó pendiente. Eso es literalmente el hilo conductor de todo lo que viene.</p>"}, {"t": 45, "title": "SGD, el aprendiz", "html": "<p><span class='cue'>[MOSTRÁ LA FÓRMULA DE SGD]</span></p><p>El primer cocinero de nuestra historia es SGD, el nombre corto de descenso de gradiente estocástico. Prueba el plato, nota algo puntual, y corrige con una cucharada de <b>tamaño fijo</b>. No recuerda absolutamente nada de la probada anterior, cada corrección arranca de cero. Es simple, es barato de calcular, y funciona razonablemente bien cuando la receta es sencilla y el error es parejo en todos lados. Pero tiene un problema grande: es puramente <b>reactivo</b>. No sabe hacia dónde venía corrigiendo en los últimos pasos, y usa exactamente la misma cuchara para todos los ingredientes de la receta, sin importar cuán sensible sea cada uno de ellos.</p>"}, {"t": 50, "title": "El límite: una sola cuchara", "html": "<p><span class='cue'>[SEÑALÁ EL GRÁFICO DEL VALLE ANGOSTO]</span></p><p>Pensemos en una receta con dos ingredientes bien distintos: la <b>sal</b>, con la que hay que ser delicado porque se nota con muy poquito, y el <b>picante</b>, que tolera cucharadas grandes sin arruinar nada de la preparación. Si la cuchara es grande, SGD se pasa de sal en cada corrección y <b>oscila</b> de un lado para el otro sin encontrar nunca el punto justo. Si la cuchara es chica, en cambio, tarda una eternidad en que se note siquiera un poquito el picante. El problema de fondo es este, y quiero que quede clarísimo: un solo tamaño de cuchara no puede ser el correcto para los dos ingredientes al mismo tiempo, por más que ajustemos su valor.</p>"}, {"t": 55, "title": "Momentum, la mano con memoria", "html": "<p><span class='cue'>[MOSTRÁ LA FÓRMULA DE MOMENTUM]</span></p><p>Acá aparece la primera mejora real de la historia: Momentum. La idea es que, en vez de corregir solo por lo que notamos en esta probada puntual, promediamos con la <b>tendencia</b> de las últimas correcciones que veníamos haciendo. Es como una cocinera con años de experiencia: si en las últimas probadas venía agregando sal de a poquito, de forma consistente, su mano ya sabe seguir en esa misma dirección, sin reaccionar de forma exagerada a un solo bocado raro que salió distinto. Las correcciones que se contradicen entre sí, mucha sal y después mucho ácido, se <b>cancelan</b> en el promedio, mientras que las correcciones consistentes se <b>refuerzan</b> cada vez más. El resultado final: llega antes al punto justo, y con exactamente la misma cuchara de siempre.</p>"}, {"t": 35, "title": "Todavía no alcanza", "html": "<p>Pero ojo, algo importante: Momentum mejora <b>hacia dónde</b> corregimos, no <b>cuánto</b> corregimos en cada ingrediente. Seguimos usando exactamente la misma cuchara para todos los ingredientes de la receta, sin distinción. Y en una receta real, cada ingrediente necesita su propio tamaño de ajuste, calibrado a su propia sensibilidad. Entonces la pregunta que nos queda pendiente, y que va a guiar la siguiente parte, es esta: ¿podemos lograr que cada ingrediente tenga su <b>propia cuchara</b>, calibrada automáticamente según cuánto se lo tuvo que corregir en el pasado?</p>"}, {"t": 60, "title": "La libreta: AdaGrad y RMSProp", "html": "<p><span class='cue'>[MOSTRÁ LAS DOS FÓRMULAS UNA AL LADO DE LA OTRA]</span></p><p>La primera respuesta seria a esa pregunta fue <b>AdaGrad</b>, publicada en 2011: la cocinera anota en una libreta cada corrección histórica de cada ingrediente, y calibra la cuchara de ese ingrediente según lo que anotó. Buena idea, sin dudas, pero con un problema serio: esa libreta <b>nunca se borra</b>, solo acumula anotaciones, receta tras receta, para siempre. Con el correr del tiempo, la cuchara se vuelve microscópica para absolutamente todo, y la cocinera termina dejando de corregir aunque el plato todavía lo necesite con urgencia. Un año después llegó la solución a ese problema puntual: <b>RMSProp</b> cambia esa libreta que nunca olvida por una <b>memoria reciente</b>, que solo pesa las últimas correcciones de cada ingrediente. La cuchara se recalibra sola, todo el tiempo, sin quedarse nunca sin margen de ajuste.</p>"}, {"t": 60, "title": "Adam, el chef maestro", "html": "<p><span class='cue'>[MOSTRÁ LAS CUATRO FÓRMULAS DE ADAM]</span></p><p>Y así llegamos al protagonista absoluto de la charla de hoy: <b>Adam</b>, publicado en el año 2014. La idea, una vez que ya tenemos todas las piezas anteriores sobre la mesa, es en realidad bastante simple: Adam es literalmente <b>Momentum más RMSProp</b>, combinados en una sola receta de ajuste. Por un lado, recuerda la tendencia de las correcciones recientes, exactamente igual que Momentum. Por otro lado, calibra una cuchara propia para cada ingrediente por separado, exactamente igual que RMSProp. Y encima le suma una corrección extra, para que las primeras probadas, cuando todavía no hay mucha información acumulada, no pesen de más en el resultado. El resultado final: cada ingrediente recibe un ajuste hecho a su propia medida, con dirección consistente y escala bien calibrada.</p>"}, {"t": 45, "title": "Por qué ganó Adam", "html": "<p>¿Por qué Adam terminó siendo la cuchara por defecto en casi todos los papers y frameworks modernos que existen? Primero, porque adapta el ajuste ingrediente por ingrediente, sin excepción. Segundo, porque hereda la memoria de tendencia de Momentum, así que no corrige a los tumbos. Tercero, porque no se queda sin margen de ajuste como le pasaba a la libreta de AdaGrad. Y cuarto, y esto es lo más importante: <b>no hace falta adivinar de antemano</b> el tamaño perfecto de cuchara para cada ingrediente. Adam se encarga de eso solo, automáticamente. Por eso hoy es, literalmente, el valor por defecto en la enorme mayoría de los proyectos de deep learning.</p>"}, {"t": 65, "title": "La cocina de muchas estaciones", "html": "<p><span class='cue'>[MOSTRÁ LA FILA DE ESTACIONES DE COCINA]</span></p><p>Ahora cambiemos de eje por un momento, porque hay un segundo problema clásico en esta historia, y es bien distinto del que veníamos hablando hasta acá. Imagínense una cocina con varias estaciones organizadas en cadena: el caldo base, la reducción, la salsa, el montaje, y el emplatado final. El comensal prueba el plato ya terminado y dice <b>«le falta sal»</b>. Ese mensaje tiene que viajar hacia atrás, estación por estación, hasta llegar de vuelta al caldo base. Pero en cada estación por la que pasa, el mensaje se repite y <b>pierde intensidad</b> — exactamente como el juego del teléfono descompuesto que jugábamos de chicos. Para cuando ese mensaje llega al caldo base, casi no queda corrección alguna, y ese cocinero de la primera estación sigue preparando exactamente lo mismo, receta tras receta, sin mejorar nunca. Esto es, ni más ni menos, lo que en redes profundas llamamos el <b>gradiente que desaparece</b>.</p>"}, {"t": 50, "title": "Por qué se diluye el mensaje", "html": "<p><span class='cue'>[MOSTRÁ LA FÓRMULA DE LA REGLA DE LA CADENA]</span></p><p>Backpropagation es, ni más ni menos, ese mismo mensaje viajando estación por estación hacia atrás, multiplicándose en cada paso por cuánto deja pasar cada una de ellas. El problema concreto es que la activación clásica, la sigmoide, tiene una derivada con un <b>techo de apenas 0.25</b>, como máximo. Multiplicar cuatro o cinco de esos techos de 0.25, uno detrás del otro, en cadena, da como resultado un mensaje casi inaudible para cuando llega a destino. El caldo base, es decir, la primera capa de toda la red, casi no recibe corrección alguna, y queda <b>congelado</b> en su estado inicial — nunca llega a aprender a mejorar su parte de la receta.</p>"}, {"t": 55, "title": "Cómo Adam ayuda (y qué no arregla)", "html": "<p>Buena pregunta para hacerle a la sala en este punto: <span class='cue'>PAUSÁ Y MIRÁ AL PÚBLICO</span> ¿Adam resuelve por completo el problema del gradiente que desaparece? La respuesta corta, y esto es importante, es que lo <b>mitiga</b>, pero no lo resuelve del todo. Si el caldo base viene recibiendo correcciones chicas de forma consistente a lo largo del entrenamiento, Adam agranda su cuchara para compensar esa debilidad, en vez de dejar que la corrección colapse a prácticamente nada. Pero ojo, esto es clave: Adam <b>no achica la cadena de estaciones</b> en sí misma. El mensaje real que llega al caldo base sigue siendo débil de por sí, Adam simplemente lo aprovecha mejor de lo que lo haría SGD. Por eso, en la práctica moderna, siempre se lo combina con activaciones ReLU, buena inicialización de pesos, normalización por capas, y conexiones residuales.</p>"}, {"t": 45, "title": "Conexión con el laboratorio", "html": "<p><span class='cue'>[MOSTRÁ EL NOTEBOOK SI VAS A HACER DEMO EN VIVO]</span></p><p>Y todo esto que acabamos de ver no se queda solamente en la teoría. Lo comprobamos con una red neuronal armada <b>desde cero, con NumPy</b>, sin ninguna caja negra de por medio, entrenada sobre el dataset público de flores Iris. Medimos la norma del gradiente <b>capa por capa</b>, en vivo, mientras la red entrenaba delante nuestro. Y el resultado fue exactamente el que predice la teoría que acabamos de repasar: con SGD puro, la primera capa recibió un mensaje <b>órdenes de magnitud</b> más débil que la última capa de la red. Con Adam, en cambio, esa brecha se achicó notoriamente, y la red aprendió más rápido y de forma bastante más estable.</p>"}, {"t": 40, "title": "Síntesis en una tabla", "html": "<p><span class='cue'>[MOSTRÁ LA TABLA COMPARATIVA]</span></p><p>Para cerrar esta parte de teoría, les dejo la síntesis en tres cocineros, tres formas bien distintas de corregir la misma receta. <b>SGD</b>: sin memoria de tendencia, sin cuchara propia por ingrediente, y con un riesgo bastante alto de arruinar el plato en cada corrección. <b>Momentum</b>: ya con memoria de tendencia, pero todavía sin una cuchara propia para cada ingrediente. Y <b>Adam</b>: memoria de tendencia y cuchara propia por ingrediente, las dos cosas a la vez — por eso es, hoy en día, la combinación que gana en la enorme mayoría de los escenarios prácticos que existen.</p>"}, {"t": 35, "title": "Cierre y preguntas", "html": "<p><span class='cue'>PAUSA LARGA, SONREÍ</span></p><p>Para resumir absolutamente todo en una sola frase: pasamos de un mensaje que se diluye camino a la primera estación, a un cocinero que aprende a calibrar cada cuchara por su propia cuenta, sin que nadie se la tenga que calibrar a mano de antemano. Muchísimas gracias por la atención de todos. Quedo abierto a preguntas, y el notebook interactivo con todo el código queda disponible para que lo exploren después con sus propios datos.</p>"}];
const TOTAL_BUDGET = 780; // segundos totales del bloque

let cum = [];
(function(){
  let acc = 0;
  SLIDES.forEach(s=>{ acc += s.t; cum.push(acc); });
})();

let idx = 0;
let elapsed = 0;
let running = false;
let timerHandle = null;

const $ = (id)=>document.getElementById(id);
const constellation = $('constellation');

function buildConstellation(){
  constellation.innerHTML = '';
  SLIDES.forEach((s,i)=>{
    const dot = document.createElement('div');
    dot.className = 'cdot';
    dot.dataset.i = i;
    constellation.appendChild(dot);
    if(i < SLIDES.length-1){
      const line = document.createElement('div');
      line.className='cline';
      line.dataset.i = i;
      constellation.appendChild(line);
    }
  });
}

function renderSlide(){
  const s = SLIDES[idx];
  $('slideTitle').textContent = s.title;
  $('slideTime').textContent = '~' + s.t + 's';
  $('slideScript').innerHTML = s.html;
  $('slideScript').scrollTop = 0;
  $('slideCount').textContent = (idx+1) + ' / ' + SLIDES.length;
  $('prevBtn').classList.toggle('disabled', idx===0);
  $('nextBtn').classList.toggle('disabled', idx===SLIDES.length-1);

  document.querySelectorAll('.cdot').forEach((d)=>{
    const i = +d.dataset.i;
    d.classList.toggle('done', i < idx);
    d.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.cline').forEach((l)=>{
    const i = +l.dataset.i;
    l.classList.toggle('done', i < idx);
  });

  const target = cum[idx];
  const pct = Math.min(100, (target / TOTAL_BUDGET) * 100);
  $('progressFill').style.width = pct + '%';
}

function fmt(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return m+':'+s;
}

function tickTimer(){
  elapsed += 1;
  $('timerDisplay').textContent = fmt(elapsed);
  const target = cum[idx];
  const diff = elapsed - target;
  const disp = $('timerDisplay');
  disp.classList.remove('warn','over');
  if(diff > 15){ disp.classList.add('over'); }
  else if(diff > 0){ disp.classList.add('warn'); }
}

$('timerToggle').addEventListener('click', ()=>{
  running = !running;
  $('timerToggle').innerHTML = running ? '&#10074;&#10074;' : '&#9654;';
  if(running){
    timerHandle = setInterval(tickTimer, 1000);
  } else {
    clearInterval(timerHandle);
  }
});
$('timerReset').addEventListener('click', ()=>{
  elapsed = 0;
  $('timerDisplay').textContent='00:00';
  $('timerDisplay').classList.remove('warn','over');
});

function goTo(n){
  if(n<0 || n>=SLIDES.length) return;
  idx = n;
  renderSlide();
}
$('prevBtn').addEventListener('click', ()=>goTo(idx-1));
$('nextBtn').addEventListener('click', ()=>goTo(idx+1));
$('swipeLeft').addEventListener('click', ()=>goTo(idx-1));
$('swipeRight').addEventListener('click', ()=>goTo(idx+1));

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(idx+1);
  if(e.key==='ArrowLeft') goTo(idx-1);
  if(e.key===' '){ e.preventDefault(); $('timerToggle').click(); }
});

let touchStartX = null;
document.addEventListener('touchstart', (e)=>{ touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', (e)=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 60){ dx < 0 ? goTo(idx+1) : goTo(idx-1); }
  touchStartX = null;
});

buildConstellation();
renderSlide();
</script>
